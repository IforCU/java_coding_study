spring.application.name=bank-learning-api
server.port=8080
spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5432/bank_learning}
spring.datasource.username=${DB_USER:bank_learning_api}
spring.datasource.password=${DB_PASSWORD:learning-api-only-password}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.read-only=true
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.validation-timeout=1000
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.data-source-properties.connectTimeout=3
spring.datasource.hikari.data-source-properties.socketTimeout=5
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
logging.level.root=WARN
logging.level.kr.banklearning.api=INFO
logging.level.com.zaxxer.hikari=OFF
logging.level.org.springframework.jdbc.core.StatementCreatorUtils=OFF
spring.mvc.log-request-details=false
